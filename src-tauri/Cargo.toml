[package]
name = "app"
version = "1.1.3"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11", features = ["devtools"] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
# CORS-free image fetch (5e.tools token art lacks ACAO headers, so the webview
# can't use it as a WebGL texture directly — we fetch the bytes via Rust).
tauri-plugin-http = "2"

# Embedded VTT relay: a WebSocket fan-out hub + HTTP map-file server hosted by
# the GM's app itself (auto-started on session start) — so direct/P2P sessions
# need no separate `node scripts/vtt-relay.mjs`.
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "fs", "io-util"] }
futures-util = "0.3"
if-addrs = "0.13"  # enumerate local network interfaces (DM picks which IPs to share over)
