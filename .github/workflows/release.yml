name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ── Desktop (Windows) ────────────────────────────────────────────────────
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need the tag commit's full message body, not just the
          # squashed --depth=1 title, so the changelog the release
          # script wrote into the commit survives.
          fetch-depth: 2

      # Pull the changelog the release script stashed in the tag
      # commit's body. Empty body → fall back to the boilerplate so
      # latest.json still has something readable.
      - name: Extract changelog from tag commit
        id: changelog
        shell: bash
        run: |
          BODY=$(git log -1 --format=%b)
          if [ -z "$BODY" ]; then
            BODY='Siehe Asset `latest.json` für Update-Details.'
          fi
          {
            echo "body<<NERDSHELF_EOF"
            echo "$BODY"
            echo "NERDSHELF_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      # ── Dataset gates ─────────────────────────────────────────────
      # Fail the workflow loudly (with a useful message) if the WH40K
      # dataset is missing or structurally broken on whatever ref was
      # tagged. The prebuild script also runs as part of `npm run build`,
      # but isolating the gates here gives clearer CI failure surface.
      - name: WH40K dataset check
        run: node scripts/check-wh40k-dataset.mjs

      - name: WH40K dataset tests
        run: node scripts/wh40k-import test

      - name: Build & Release
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Vite build needs Supabase env vars baked in at build time
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'NerdShelf ${{ github.ref_name }}'
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
