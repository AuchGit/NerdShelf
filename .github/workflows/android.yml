name: Android

# Signed APKs for a release: attached to the GitHub release next to the Windows
# installer, plus android-* entries in its latest.json for the in-app updater.
# Runs after every successful "Release" run, or by hand (Actions -> Android ->
# Run workflow) for an existing release tag.
# Needs the secrets from SETUP_ANDROID.md.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release-Tag, z. B. v1.1.40 (leer = neuestes Release)'
        required: false

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  apk:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Which release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ] && [ "${{ github.event_name }}" = "workflow_run" ]; then TAG="${{ github.event.workflow_run.head_branch }}"; fi
          if [ -z "$TAG" ]; then TAG=$(gh release view -R "${{ github.repository }}" --json tagName -q .tagName); fi
          echo "Release: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # The runner already has the Android SDK; only add NDK, platform and build tools.
      - name: Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;26.1.10909125" "platforms;android-34" "build-tools;34.0.0"

      - name: Set NDK env
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: android

      - name: Install cargo-tauri
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2

      - name: Install frontend dependencies
        run: npm ci

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p src-tauri/gen/android/app
          echo -n "$ANDROID_KEYSTORE_BASE64" | base64 -d > src-tauri/gen/android/app/release.keystore

      - name: Write keystore.properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > src-tauri/gen/android/app/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      # Phones: 64-bit ARM (almost all) and 32-bit ARM (older ones).
      # Same CLI as the one Gradle calls back (cargo tauri), or they don't find each other.
      - name: Build Android APKs
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: cargo tauri android build --apk --split-per-abi --target aarch64 --target armv7

      - name: Sign APKs with the updater key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          OUT_DIR="src-tauri/gen/android/app/build/outputs/apk"
          find "$OUT_DIR" -name "*.apk" -print
          STAGE_DIR="android-release"
          mkdir -p "$STAGE_DIR"
          # Gradle names them app-arm64-release.apk / app-arm-release.apk
          declare -A ABI_MAP=( ["arm64"]="aarch64" ["arm"]="armv7" )
          for ABI in "${!ABI_MAP[@]}"; do
            ARCH="${ABI_MAP[$ABI]}"
            SRC=$(find "$OUT_DIR" -name "app-${ABI}-release*.apk" 2>/dev/null | head -n1 || true)
            if [ -z "$SRC" ]; then echo "WARN: no APK for $ABI"; continue; fi
            DST="$STAGE_DIR/NerdShelf_${{ steps.tag.outputs.tag }}_android-${ARCH}.apk"
            cp "$SRC" "$DST"
            cargo tauri signer sign --private-key "$TAURI_SIGNING_PRIVATE_KEY" --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$DST"
          done
          ls -la "$STAGE_DIR"
          test -n "$(ls $STAGE_DIR/*.apk 2>/dev/null)"

      - name: Upload APKs to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            android-release/*.apk
            android-release/*.apk.sig

      - name: Add Android entries to latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/patch-android-updater.mjs "${{ steps.tag.outputs.tag }}" "${{ github.repository }}" "android-release"
